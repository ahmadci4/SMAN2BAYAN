<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Guru - SMAN 2 Bayan</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
</head>
<body style="background-color: #f4f7fe; padding: 20px;">
    <header class="app-header" style="max-width: 800px; margin: 0 auto; border-radius: 20px; display:flex; justify-content:space-between; align-items:center; padding:15px 20px;">
        <div class="school-info">
            <h1>Panel Guru SMAN 2 BAYAN</h1>
        </div>
        <button id="btn-logout" style="display: none; background: #fee2e2; color: #dc2626; padding: 8px 15px; border: none; border-radius: 10px; font-weight: bold; cursor: pointer;" onclick="logoutGuru()">Logout</button>
    </header>

    <main style="max-width: 800px; margin: 20px auto;">
        
        <!-- Login Section -->
        <div id="login-section" style="background: white; padding: 25px; border-radius: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.03);">
            <h2 style="color: #2b3674; margin-bottom: 15px;">Login Guru</h2>
            <input type="email" id="email-guru" placeholder="Email Guru" style="width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #e2e8f0; border-radius: 10px;">
            <input type="password" id="password-guru" placeholder="Password" style="width: 100%; padding: 12px; margin-bottom: 20px; border: 1px solid #e2e8f0; border-radius: 10px;">
            <button onclick="loginGuru()" style="width: 100%; background: #4318ff; color: white; padding: 12px; border: none; border-radius: 10px; font-weight: bold; cursor: pointer;">Masuk</button>
        </div>

        <!-- Dashboard Guru -->
        <div id="dashboard-section" style="display: none;">
            
            <div style="display: flex; gap: 8px; margin-bottom: 20px; flex-wrap:wrap;">
                <button onclick="switchTab('input')" id="tbtn-input" style="flex: 1; padding:10px;" class="btn-primary">Tambah Materi</button>
                <button onclick="switchTab('list')" id="tbtn-list" style="flex: 1; padding:10px; background:#475569;" class="btn-primary">Daftar Materi</button>
                <button onclick="switchTab('profil')" id="tbtn-profil" style="flex: 1; padding:10px; background:#05cd99;" class="btn-primary">Edit Profil</button>
                <button onclick="switchTab('notif')" id="tbtn-notif" style="flex: 1; padding:10px; background: #f2994a;" class="btn-primary">Diskusi <span id="badge-notif" style="background: red; border-radius: 50%; padding: 2px 6px; font-size: 11px; display: none;">0</span></button>
            </div>

            <!-- Tab 1: Tambah Materi -->
            <div id="tab-input" class="detail-box">
                <h2 style="color: #2b3674; margin-bottom: 15px;">Tambah Materi Baru</h2>
                
                <label style="font-weight: 600; font-size: 0.9rem; color: #a3aed1;">Mata Pelajaran:</label>
                <select id="input-mapel" style="width: 100%; padding: 12px; margin-top: 5px; margin-bottom: 15px; border: 1px solid #e2e8f0; border-radius: 10px;">
                    <option value="Fisika">Fisika</option>
                </select>

                <label style="font-weight: 600; font-size: 0.9rem; color: #a3aed1;">Kelas:</label>
                <select id="input-kelas" style="width: 100%; padding: 12px; margin-top: 5px; margin-bottom: 15px; border: 1px solid #e2e8f0; border-radius: 10px;">
                    <optgroup label="Kelas X">
                        <option value="X.A">Kelas X.A</option>
                        <option value="X.B">Kelas X.B</option>
                        <option value="X.C">Kelas X.C</option>
                        <option value="X.D">Kelas X.D</option>
                    </optgroup>
                    <optgroup label="Kelas XI">
                        <option value="XI.A">Kelas XI.A</option>
                        <option value="XI.B">Kelas XI.B</option>
                        <option value="XI.C">Kelas XI.C</option>
                        <option value="XI.D">Kelas XI.D</option>
                    </optgroup>
                    <optgroup label="Kelas XII">
                        <option value="XII.A">Kelas XII.A</option>
                        <option value="XII.B">Kelas XII.B</option>
                        <option value="XII.C">Kelas XII.C</option>
                        <option value="XII.D">Kelas XII.D</option>
                    </optgroup>
                </select>

                <label style="font-weight: 600; font-size: 0.9rem; color: #a3aed1;">Judul Bab Utama:</label>
                <input type="text" id="input-bab" placeholder="Contoh: Pengukuran" style="width: 100%; padding: 12px; margin-top: 5px; margin-bottom: 15px; border: 1px solid #e2e8f0; border-radius: 10px;">

                <label style="font-weight: 600; font-size: 0.9rem; color: #a3aed1;">Sub Judul Materi:</label>
                <input type="text" id="input-subbab" placeholder="Contoh: Macam-macam Alat Ukur" style="width: 100%; padding: 12px; margin-top: 5px; margin-bottom: 15px; border: 1px solid #e2e8f0; border-radius: 10px;">

                <label style="font-weight: 600; font-size: 0.9rem; color: #a3aed1;">Penjelasan Singkat / Pengantar Materi:</label>
                <textarea id="input-deskripsi" rows="3" placeholder="Berikan penjelasan pengantar..." style="width: 100%; padding: 12px; margin-top: 5px; margin-bottom: 25px; border: 1px solid #e2e8f0; border-radius: 10px;"></textarea>

                <div style="background: #f8fafc; padding: 15px; border-radius: 10px; margin-bottom: 20px; border: 1px solid #e2e8f0;">
                    <h3 style="font-size: 1rem; color: #4318ff; margin-bottom: 10px;">Lampiran Media & Literatur (YouTube/Drive/Sosmed)</h3>
                    <input type="text" id="ket-link-1" placeholder="Keterangan 1 (Misal: Video YouTube)" style="width: 100%; padding: 10px; margin-bottom: 5px; border: 1px solid #cbd5e1; border-radius: 8px;">
                    <input type="url" id="url-link-1" placeholder="Paste URL..." style="width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid #cbd5e1; border-radius: 8px;">

                    <input type="text" id="ket-link-2" placeholder="Keterangan 2 (Misal: Modul Drive)" style="width: 100%; padding: 10px; margin-bottom: 5px; border: 1px solid #cbd5e1; border-radius: 8px;">
                    <input type="url" id="url-link-2" placeholder="Paste URL..." style="width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid #cbd5e1; border-radius: 8px;">
                </div>

                <label style="font-weight: 600; font-size: 0.9rem; color: #a3aed1;">Tugas / PR (Opsional):</label>
                <textarea id="input-pr" rows="2" placeholder="Tulis instruksi tugas..." style="width: 100%; padding: 12px; margin-top: 5px; margin-bottom: 20px; border: 1px solid #e2e8f0; border-radius: 10px;"></textarea>

                <button id="btn-submit" onclick="unggahMateri()" style="width: 100%; background: #05cd99; color: white; padding: 15px; border: none; border-radius: 10px; font-weight: bold; cursor: pointer;">Simpan Materi ke Database</button>
            </div>

            <!-- Tab 2: Daftar Materi Guru -->
            <div id="tab-list" class="detail-box" style="display: none;">
                <h2 style="color: #2b3674; margin-bottom: 15px;">Daftar Materi yang Diunggah</h2>
                <div id="daftar-materi-guru">
                    <p style="color:grey;">Memuat daftar materi...</p>
                </div>
            </div>

            <!-- Tab 3: Edit Profil Guru Lengkap -->
            <div id="tab-profil" class="detail-box" style="display: none;">
                <h2 style="color: #2b3674; margin-bottom: 15px;">Edit Profil Guru</h2>
                
                <label style="font-weight: 600; font-size: 0.9rem; color: #a3aed1;">Nama Lengkap & Gelar:</label>
                <input type="text" id="prof-nama" placeholder="Contoh: Rianti, S.Pd." style="width: 100%; padding: 10px; margin-bottom: 12px; border: 1px solid #e2e8f0; border-radius: 8px;">

                <label style="font-weight: 600; font-size: 0.9rem; color: #a3aed1;">Gelar Akademik & Kampus Kelulusan:</label>
                <input type="text" id="prof-gelar" placeholder="Contoh: Sarjana Pendidikan Fisika" style="width: 100%; padding: 10px; margin-bottom: 6px; border: 1px solid #e2e8f0; border-radius: 8px;">
                <input type="text" id="prof-kampus" placeholder="Contoh: Universitas Mataram" style="width: 100%; padding: 10px; margin-bottom: 12px; border: 1px solid #e2e8f0; border-radius: 8px;">

                <label style="font-weight: 600; font-size: 0.9rem; color: #a3aed1;">Mata Pelajaran yang Diampu:</label>
                <input type="text" id="prof-mapel" placeholder="Contoh: Fisika" style="width: 100%; padding: 10px; margin-bottom: 12px; border: 1px solid #e2e8f0; border-radius: 8px;">

                <label style="font-weight: 600; font-size: 0.9rem; color: #a3aed1;">Quote / Moto Mengajar:</label>
                <textarea id="prof-quote" rows="2" placeholder="Tulis moto hidup/mengajar..." style="width: 100%; padding: 10px; margin-bottom: 12px; border: 1px solid #e2e8f0; border-radius: 8px;"></textarea>

                <label style="font-weight: 600; font-size: 0.9rem; color: #a3aed1;">URL Foto Profil (Link Gambar):</label>
                <input type="url" id="prof-foto" placeholder="https://..." style="width: 100%; padding: 10px; margin-bottom: 12px; border: 1px solid #e2e8f0; border-radius: 8px;">

                <label style="font-weight: 600; font-size: 0.9rem; color: #a3aed1;">Email & WhatsApp:</label>
                <input type="email" id="prof-email" placeholder="email@sekolah.sch.id" style="width: 100%; padding: 10px; margin-bottom: 6px; border: 1px solid #e2e8f0; border-radius: 8px;">
                <input type="text" id="prof-wa" placeholder="Nomor WA (Contoh: 62812...)" style="width: 100%; padding: 10px; margin-bottom: 12px; border: 1px solid #e2e8f0; border-radius: 8px;">

                <label style="font-weight: 600; font-size: 0.9rem; color: #a3aed1;">Link Instagram & Google Maps Rumah:</label>
                <input type="url" id="prof-ig" placeholder="https://instagram.com/..." style="width: 100%; padding: 10px; margin-bottom: 6px; border: 1px solid #e2e8f0; border-radius: 8px;">
                <input type="url" id="prof-maps" placeholder="https://maps.google.com/..." style="width: 100%; padding: 10px; margin-bottom: 20px; border: 1px solid #e2e8f0; border-radius: 8px;">

                <button onclick="simpanProfilGuru()" style="width: 100%; background: #4318ff; color: white; padding: 12px; border: none; border-radius: 10px; font-weight: bold; cursor: pointer;">Simpan Perubahan Profil</button>
            </div>

            <!-- Tab 4: Diskusi & Balasan Guru -->
            <div id="tab-notif" class="detail-box" style="display: none;">
                <h2 style="color: #2b3674; margin-bottom: 15px;">Pertanyaan & Diskusi Siswa</h2>
                <div id="list-pertanyaan">
                    <p style="color:grey;">Memuat diskusi...</p>
                </div>
            </div>

        </div>
    </main>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCKG-pHGN3Wz7X9q9BnSL-dChSNX87EpyY",
            authDomain: "e-learning-sman-2-bayan.firebaseapp.com",
            projectId: "e-learning-sman-2-bayan",
            storageBucket: "e-learning-sman-2-bayan.firebasestorage.app",
            messagingSenderId: "715837451881",
            appId: "1:715837451881:web:48540594fe89d36d8c3cf8",
            measurementId: "G-TTVZ22Z4H5"
        };

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        function loginGuru() {
            const email = document.getElementById('email-guru').value;
            const pass = document.getElementById('password-guru').value;
            auth.signInWithEmailAndPassword(email, pass).catch((error) => alert("Gagal login: " + error.message));
        }
        function logoutGuru() { auth.signOut(); }

        auth.onAuthStateChanged((user) => {
            if (user) {
                document.getElementById('login-section').style.display = 'none';
                document.getElementById('dashboard-section').style.display = 'block';
                document.getElementById('btn-logout').style.display = 'block';
                loadDaftarMateriGuru();
                loadProfilGuruForm();
                listenDiskusiGuru();
            } else {
                document.getElementById('login-section').style.display = 'block';
                document.getElementById('dashboard-section').style.display = 'none';
                document.getElementById('btn-logout').style.display = 'none';
            }
        });

        function switchTab(tab) {
            document.getElementById('tab-input').style.display = tab === 'input' ? 'block' : 'none';
            document.getElementById('tab-list').style.display = tab === 'list' ? 'block' : 'none';
            document.getElementById('tab-profil').style.display = tab === 'profil' ? 'block' : 'none';
            document.getElementById('tab-notif').style.display = tab === 'notif' ? 'block' : 'none';
            if(tab === 'list') loadDaftarMateriGuru();
        }

        function unggahMateri() {
            const btnSubmit = document.getElementById('btn-submit');
            let tautan = [];
            if (document.getElementById('url-link-1').value) tautan.push({ label: document.getElementById('ket-link-1').value || 'Media 1', url: document.getElementById('url-link-1').value });
            if (document.getElementById('url-link-2').value) tautan.push({ label: document.getElementById('ket-link-2').value || 'Media 2', url: document.getElementById('url-link-2').value });

            const data = {
                mapel: document.getElementById('input-mapel').value,
                kelas: document.getElementById('input-kelas').value,
                bab: document.getElementById('input-bab').value,
                subBab: document.getElementById('input-subbab').value,
                deskripsi: document.getElementById('input-deskripsi').value,
                links: tautan,
                pr: document.getElementById('input-pr').value,
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            };
            
            if(!data.bab || !data.subBab) return alert("Harap isi Judul dan Sub Judul Bab!");

            btnSubmit.innerText = "Menyimpan...";
            btnSubmit.disabled = true;

            db.collection("materi_pelajaran").add(data).then(() => {
                alert("Berhasil mengunggah materi!");
                document.getElementById('input-bab').value = '';
                document.getElementById('input-subbab').value = '';
                document.getElementById('input-deskripsi').value = '';
                document.getElementById('url-link-1').value = ''; document.getElementById('ket-link-1').value = '';
                document.getElementById('url-link-2').value = ''; document.getElementById('ket-link-2').value = '';
                document.getElementById('input-pr').value = '';
                switchTab('list');
            }).catch(err => alert("Error: " + err.message))
            .finally(() => { btnSubmit.innerText = "Simpan Materi ke Database"; btnSubmit.disabled = false; });
        }

        function loadDaftarMateriGuru() {
            const container = document.getElementById('daftar-materi-guru');
            container.innerHTML = "<p>Memuat daftar materi...</p>";
            
            db.collection("materi_pelajaran").get().then((snapshot) => {
                if(snapshot.empty) {
                    container.innerHTML = "<p style='color:grey;'>Belum ada materi yang diunggah.</p>";
                    return;
                }
                container.innerHTML = '';
                snapshot.forEach((doc) => {
                    const m = doc.data();
                    container.innerHTML += `
                        <div style="background:#f8fafc; border:1px solid #e2e8f0; padding:12px; border-radius:8px; margin-bottom:10px; display:flex; justify-content:space-between; align-items:center;">
                            <div>
                                <span style="background:#4318ff; color:white; font-size:0.75rem; padding:2px 6px; border-radius:4px;">${m.kelas}</span>
                                <strong style="color:#2b3674; margin-left:8px;">${m.bab}</strong> - <span style="font-size:0.9rem; color:#64748b;">${m.subBab}</span>
                            </div>
                            <button onclick="hapusMateri('${doc.id}')" style="background:#fee2e2; color:#dc2626; border:none; padding:6px 12px; border-radius:6px; cursor:pointer; font-weight:bold;"><i class="fa-solid fa-trash"></i> Hapus</button>
                        </div>
                    `;
                });
            });
        }

        function hapusMateri(id) {
            if(confirm("Yakin ingin menghapus materi ini?")) {
                db.collection("materi_pelajaran").doc(id).delete().then(() => {
                    loadDaftarMateriGuru();
                });
            }
        }

        function loadProfilGuruForm() {
            db.collection("profil_guru").doc("utama").get().then((doc) => {
                if(doc.exists) {
                    const d = doc.data();
                    document.getElementById('prof-nama').value = d.nama || '';
                    document.getElementById('prof-gelar').value = d.gelar || '';
                    document.getElementById('prof-kampus').value = d.kampus || '';
                    document.getElementById('prof-mapel').value = d.mapel || '';
                    document.getElementById('prof-quote').value = d.quote || '';
                    document.getElementById('prof-foto').value = d.foto || '';
                    document.getElementById('prof-email').value = d.email || '';
                    document.getElementById('prof-wa').value = d.whatsapp || '';
                    document.getElementById('prof-ig').value = d.instagram || '';
                    document.getElementById('prof-maps').value = d.maps || '';
                }
            });
        }

        function simpanProfilGuru() {
            const data = {
                nama: document.getElementById('prof-nama').value,
                gelar: document.getElementById('prof-gelar').value,
                kampus: document.getElementById('prof-kampus').value,
                mapel: document.getElementById('prof-mapel').value,
                quote: document.getElementById('prof-quote').value,
                foto: document.getElementById('prof-foto').value,
                email: document.getElementById('prof-email').value,
                whatsapp: document.getElementById('prof-wa').value,
                instagram: document.getElementById('prof-ig').value,
                maps: document.getElementById('prof-maps').value
            };
            db.collection("profil_guru").doc("utama").set(data, { merge: true }).then(() => {
                alert("Profil guru berhasil diperbarui!");
            }).catch(err => alert("Gagal menyimpan profil: " + err.message));
        }

        function listenDiskusiGuru() {
            db.collection("diskusi").orderBy("waktu", "desc").onSnapshot((snapshot) => {
                const listDiv = document.getElementById('list-pertanyaan');
                listDiv.innerHTML = '';
                if(snapshot.empty) {
                    listDiv.innerHTML = '<p style="color:grey;">Belum ada pertanyaan siswa.</p>';
                    return;
                }
                
                let allChat = [];
                snapshot.forEach(doc => allChat.push({ id: doc.id, ...doc.data() }));
                let parents = allChat.filter(c => !c.parentId);

                document.getElementById('badge-notif').style.display = parents.length > 0 ? 'inline-block' : 'none';
                document.getElementById('badge-notif').innerText = parents.length;

                parents.forEach(p => {
                    let replies = allChat.filter(c => c.parentId === p.id);
                    let repHtml = '';
                    replies.forEach(r => {
                        repHtml += `<div style="background:#f1f5f9; padding:8px; border-radius:6px; margin-top:5px; margin-left:15px;"><strong>${r.pengirim}:</strong> ${r.pesan}</div>`;
                    });

                    listDiv.innerHTML += `
                        <div style="border:1px solid #e2e8f0; padding:12px; border-radius:8px; margin-bottom:12px; background:white;">
                            <strong style="color:#4318ff;">${p.pengirim}</strong> bertanya:
                            <p style="margin:5px 0;">${p.pesan}</p>
                            ${repHtml}
                            <div style="margin-top:8px; display:flex; gap:5px;">
                                <input type="text" id="guru-reply-${p.id}" placeholder="Balas sebagai Guru..." style="flex:1; padding:6px; border:1px solid #cbd5e1; border-radius:6px; font-size:0.85rem;">
                                <button onclick="kirimBalasanGuru('${p.materiId}', '${p.id}')" class="btn-primary" style="padding:6px 12px; font-size:0.8rem;">Balas</button>
                            </div>
                        </div>
                    `;
                });
            });
        }

        function kirimBalasanGuru(materiId, parentId) {
            const pesan = document.getElementById(`guru-reply-${parentId}`).value.trim();
            if(!pesan) return alert("Pesan balasan tidak boleh kosong!");

            db.collection("diskusi").add({
                materiId: materiId,
                pengirim: "Ibu Guru (Rianti, S.Pd.)",
                pesan: pesan,
                parentId: parentId,
                isGuru: true,
                waktu: firebase.firestore.FieldValue.serverTimestamp()
            }).then(() => {
                document.getElementById(`guru-reply-${parentId}`).value = "";
            });
        }
    </script>
</body>
</html>
