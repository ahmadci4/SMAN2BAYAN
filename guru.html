<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Guru - E-Learning SMAN 2 Bayan</title>
    <link rel="stylesheet" href="style.css">
    
    <!-- Firebase SDK (Versi Compat untuk Vanilla JS) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
</head>
<body style="background-color: #f4f7fe; padding: 20px;">
    <header class="app-header" style="max-width: 600px; margin: 0 auto; border-radius: 20px;">
        <div class="school-info">
            <h1>Panel Guru SMAN 2 BAYAN</h1>
        </div>
        <button id="btn-logout" style="display: none; background: #e2e8f0; color: #475569; padding: 10px 15px; border: none; border-radius: 10px; font-weight: bold; cursor: pointer;" onclick="logoutGuru()">Logout</button>
    </header>

    <main style="max-width: 600px; margin: 20px auto;">
        
        <!-- Bagian Login -->
        <div id="login-section" style="background: white; padding: 25px; border-radius: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.03);">
            <h2 style="color: #2b3674; margin-bottom: 15px;">Login Guru</h2>
            <input type="email" id="email-guru" placeholder="Email Guru" style="width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #e2e8f0; border-radius: 10px;">
            <input type="password" id="password-guru" placeholder="Password" style="width: 100%; padding: 12px; margin-bottom: 20px; border: 1px solid #e2e8f0; border-radius: 10px;">
            <button onclick="loginGuru()" style="width: 100%; background: #4318ff; color: white; padding: 12px; border: none; border-radius: 10px; font-weight: bold; cursor: pointer;">Masuk</button>
        </div>

        <!-- Bagian Input Materi (Disembunyikan sebelum login) -->
        <div id="input-section" style="display: none; background: white; padding: 25px; border-radius: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.03);">
            <h2 style="color: #2b3674; margin-bottom: 15px;">Tambah Materi Baru</h2>
            
            <label style="font-weight: 600; font-size: 0.9rem; color: #a3aed1;">Mata Pelajaran:</label>
            <select id="input-mapel" style="width: 100%; padding: 12px; margin-top: 5px; margin-bottom: 15px; border: 1px solid #e2e8f0; border-radius: 10px;">
                <option value="Fisika">Fisika</option>
                <!-- Tambahkan mapel lain jika diperlukan -->
            </select>

            <label style="font-weight: 600; font-size: 0.9rem; color: #a3aed1;">Kelas (Fase):</label>
            <select id="input-kelas" style="width: 100%; padding: 12px; margin-top: 5px; margin-bottom: 15px; border: 1px solid #e2e8f0; border-radius: 10px;">
                <option value="Kelas 10">Kelas 10 (Fase E)</option>
                <option value="Kelas 11">Kelas 11 (Fase F)</option>
                <option value="Kelas 12">Kelas 12 (Fase F)</option>
            </select>

            <label style="font-weight: 600; font-size: 0.9rem; color: #a3aed1;">Judul Bab / Materi:</label>
            <input type="text" id="input-bab" placeholder="Contoh: Pengukuran" style="width: 100%; padding: 12px; margin-top: 5px; margin-bottom: 15px; border: 1px solid #e2e8f0; border-radius: 10px;">

            <label style="font-weight: 600; font-size: 0.9rem; color: #a3aed1;">Sub-materi (Pisahkan dengan baris baru / Enter):</label>
            <textarea id="input-isi" rows="5" placeholder="Hakikat Fisika&#10;Macam-macam alat ukur" style="width: 100%; padding: 12px; margin-top: 5px; margin-bottom: 20px; border: 1px solid #e2e8f0; border-radius: 10px;"></textarea>

            <button onclick="unggahMateri()" style="width: 100%; background: #05cd99; color: white; padding: 12px; border: none; border-radius: 10px; font-weight: bold; cursor: pointer;">Simpan Materi ke Database</button>
        </div>
    </main>

    <script>
        // Konfigurasi Firebase Web App Anda
        const firebaseConfig = {
            apiKey: "AIzaSyCKG-pHGN3Wz7X9q9BnSL-dChSNX87EpyY",
            authDomain: "e-learning-sman-2-bayan.firebaseapp.com",
            projectId: "e-learning-sman-2-bayan",
            storageBucket: "e-learning-sman-2-bayan.firebasestorage.app",
            messagingSenderId: "715837451881",
            appId: "1:715837451881:web:48540594fe89d36d8c3cf8",
            measurementId: "G-TTVZ22Z4H5"
        };

        // Inisialisasi Firebase
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const auth = firebase.auth();
        const db = firebase.firestore();

        function loginGuru() {
            const email = document.getElementById('email-guru').value;
            const pass = document.getElementById('password-guru').value;
            
            auth.signInWithEmailAndPassword(email, pass)
                .then((userCredential) => {
                    document.getElementById('login-section').style.display = 'none';
                    document.getElementById('input-section').style.display = 'block';
                    document.getElementById('btn-logout').style.display = 'block';
                })
                .catch((error) => alert("Gagal login: " + error.message));
        }

        function logoutGuru() {
            auth.signOut().then(() => {
                document.getElementById('login-section').style.display = 'block';
                document.getElementById('input-section').style.display = 'none';
                document.getElementById('btn-logout').style.display = 'none';
            });
        }

        auth.onAuthStateChanged((user) => {
            if (user) {
                document.getElementById('login-section').style.display = 'none';
                document.getElementById('input-section').style.display = 'block';
                document.getElementById('btn-logout').style.display = 'block';
            }
        });

        function unggahMateri() {
            const mapel = document.getElementById('input-mapel').value;
            const kelas = document.getElementById('input-kelas').value;
            const bab = document.getElementById('input-bab').value;
            const isiText = document.getElementById('input-isi').value;
            
            if(!bab || !isiText) return alert("Harap isi Judul Bab dan Sub-materi!");

            const isiArray = isiText.split('\n').filter(item => item.trim() !== "");

            db.collection("materi_pelajaran").add({
                mapel: mapel,
                kelas: kelas,
                bab: bab,
                isi: isiArray,
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            })
            .then(() => {
                alert("Berhasil! Materi langsung tersedia di aplikasi siswa.");
                document.getElementById('input-bab').value = '';
                document.getElementById('input-isi').value = '';
            })
            .catch((error) => console.error("Error: ", error));
        }
    </script>
</body>
</html>
